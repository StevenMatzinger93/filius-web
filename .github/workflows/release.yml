name: Windows-exe bauen

# Baut die portable exe (FiliusWeb-<version>-portable.exe).
# - Von Hand: Actions → «Windows-exe bauen» → «Run workflow»; die exe liegt danach unter «Artifacts».
# - Mit einer Versionsmarke (z. B. «git tag v0.2.0» und «git push --tags») wird sie zusätzlich
#   an ein GitHub-Release angehängt und ist dort für alle herunterladbar.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: FiliusWeb-portable
          path: release/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
